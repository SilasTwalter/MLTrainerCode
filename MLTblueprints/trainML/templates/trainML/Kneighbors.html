{% extends "base.html" %}
{% block title %}Kneighbors parameters{% endblock %}

{% block content %}
<link rel="stylesheet" href="mystyle.css">    
<h1>Parameters for Kneighbors</h1>
    <form action = "{{ url_for('trainML.Kneighbors')}}" method = "POST">
        <!--I don't think these labels are working properly-->
        <label for = "testingSize">Testing Data Size</label>
        <input type = "number" id = "testingSize" name = "testingSize" placeholder= "eg. 0.2" max = "0.99" step = "0.01" required = "required">
        
        <label for = "totalNeighbors">Number of Neighbors</label>
        <input type = "number" id = "totalNeighbors" name = "totalNeighbors" placeholder= "eg. 5" required = "required">
        


        <label for = "uniformWeight">Uniform Weight</label>
        <input type = "radio" id = "uniformWeight" name = "modelWeight" value = "uniform" required = "required">
        <label for = "distanceWeight">Distance Weight</label>
        <input type = "radio" id = "distanceWeight" name = "modelWeight" value = "distance" required = "required">
        <input type = "submit" value = "Create">
    </form>
{% endblock %}
